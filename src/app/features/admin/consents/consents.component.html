<mat-card class="consent-card">
  <div class="card-header">
    <div class="stats">
      <div class="stat">
        <div class="stat-title">Actifs</div>
        <div class="stat-value">{{ activeCount }}</div>
      </div>
      <div class="stat">
        <div class="stat-title">Inactifs</div>
        <div class="stat-value">{{ inactiveCount }}</div>
      </div>
    </div>

    <button mat-raised-button color="primary" class="add-button" (click)="createConsentType()">
      <mat-icon>add</mat-icon>
      Ajouter Consentement
    </button>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="consentTypes" class="consents-table mat-elevation-z2">

      <!-- Code Column -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let type">{{ type.code }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let type">{{ type.name }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let type">
          <mat-chip [color]="type.isActive ? 'primary' : 'warn'" selected>
            {{ type.isActive ? 'Actif' : 'Inactif' }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Nombre Column -->
      <ng-container matColumnDef="nbr">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let type">{{ type.nbr }}</td>
      </ng-container>

      <!-- Créé le Column -->
      <ng-container matColumnDef="grantedAt">
        <th mat-header-cell *matHeaderCellDef>Créé le</th>
        <td mat-cell *matCellDef="let type">{{ type.grantedAt | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <!-- Mis à jour le Column -->
      <ng-container matColumnDef="updatedAt">
        <th mat-header-cell *matHeaderCellDef>Mis à jour le</th>
        <td mat-cell *matCellDef="let type">{{ type.updatedAt | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let type">
          <button mat-button color="primary" *ngIf="!type.isActive" (click)="activate(type)">Activer</button>
          <button mat-button color="warn" *ngIf="type.isActive" (click)="deactivate(type)">Désactiver</button>
          <button mat-button color="accent" (click)="delete(type)">Supprimer</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['code','name','isActive','nbr','grantedAt','updatedAt','actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['code','name','isActive','nbr','grantedAt','updatedAt','actions']"></tr>
    </table>
  </div>
</mat-card>
