<div class="page-container">

  <!-- HEADER -->
  <div class="page-header">
    <div class="header-content">
      <h1>Agents</h1>
      <p>Gestion des agents du système</p>
    </div>

    <button mat-raised-button color="primary" (click)="addAgent()">
      <mat-icon>person_add</mat-icon>
      Ajouter
    </button>
  </div>

  <!-- FILTRE -->
  <mat-card class="filter-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher un agent</mat-label>
      <input matInput placeholder="Nom, email ou téléphone">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <!-- TABLE -->
  <mat-card class="table-card">
    <table mat-table [dataSource]="agents" class="agents-table">

      <!-- ID -->
      <!-- <ng-container matColumnDef="agentId">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let agent">{{ agent.agentId }}</td>
      </ng-container> -->

      <!-- Nom complet -->
      <!-- <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let agent">
          <div class="agent-name">
            <div class="avatar">{{ agent.firstName.charAt(0) }}{{ agent.lastName.charAt(0) }}</div>
            <span>{{ agent.firstName }} </span>
          </div>
        </td>
      </ng-container> -->
      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>Nom Complet</th>
        <td mat-cell *matCellDef="let agent">{{ agent.firstName+" " }}{{ agent.lastName }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let agent">{{ agent.email }}</td>
      </ng-container>

      <!-- Téléphone -->
      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef>Téléphone</th>
        <td mat-cell *matCellDef="let agent">{{ agent.phoneNumber }}</td>
      </ng-container>

      <!-- Adresse -->
      <ng-container matColumnDef="adresse">
        <th mat-header-cell *matHeaderCellDef>Adresse</th>
        <td mat-cell *matCellDef="let agent">{{ agent.adresse }}</td>
      </ng-container>

      <!-- Statut -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let agent">
          <mat-chip [ngClass]="{'status-actif': agent.status === 'actif', 'status-inactif': agent.status !== 'actif'}">
            {{ agent.status }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Date de création -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Créé le</th>
        <td mat-cell *matCellDef="let agent">{{ agent.createdAt | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let agent">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>

          <mat-menu #menu="matMenu">

  <!-- Suspendre : uniquement si l'agent n'est pas déjà SUSPENDED -->
  <button mat-menu-item *ngIf="agent.status !== 'SUSPENDED'" (click)="suspendre(agent)">
    <mat-icon>block</mat-icon>
    Suspendre
  </button>

  <!-- Activer : uniquement si l'agent n'est pas déjà ACTIVE -->
  <button mat-menu-item *ngIf="agent.status !== 'ACTIVE'" (click)="activate(agent)">
    <mat-icon>check_circle</mat-icon>
    Activer
  </button>

  <!-- Désactiver : uniquement si l'agent n'est pas déjà INACTIVE -->
  <button mat-menu-item *ngIf="agent.status !== 'INACTIVE'" (click)="desactivate(agent)">
    <mat-icon>cancel</mat-icon>
    Désactiver
  </button>

  <!-- Supprimer : toujours disponible -->
  <button mat-menu-item class="delete-action" (click)="onDelete(agent)">
    <mat-icon>delete</mat-icon>
    Supprimer
  </button>
</mat-menu>


        </td>
      </ng-container>

      <!-- Header & Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </mat-card>
</div>
