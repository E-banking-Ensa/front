<mat-sidenav-container class="sidenav-container">
  <!-- Sidebar -->
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-toolbar color="primary">
      <span>E-Banking 3.0</span>
    </mat-toolbar>

    <mat-nav-list>
      <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/admin/agents" routerLinkActive="active">
        <mat-icon matListItemIcon>supervisor_account</mat-icon>
        <span matListItemTitle>Agents</span>
      </a>
      <a mat-list-item routerLink="/admin/clients" routerLinkActive="active">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Clients</span>
      </a>
      <a mat-list-item routerLink="/admin/consents" routerLinkActive="active">
        <mat-icon matListItemIcon>assignment_turned_in</mat-icon>
        <span matListItemTitle>Consents</span>
      </a>
      <a mat-list-item routerLink="/admin/accounts" routerLinkActive="active">
        <mat-icon matListItemIcon>account_balance</mat-icon>
        <span matListItemTitle>Comptes</span>
      </a>
      <mat-divider></mat-divider>
      <a mat-list-item routerLink="/logout">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Déconnexion</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenu principal -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="header">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Administration</span>
      <span class="spacer"></span>
      <span>{{ currentUser }}</span>
      <button mat-icon-button>
        <mat-icon>notifications</mat-icon>
      </button>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
