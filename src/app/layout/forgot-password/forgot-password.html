<div class="fp-wrapper">

    <main class="fp-main">
        <div class="content-container">
            <div class="fp-card">
                <div class="icon-section">
                    <div class="lock-circle">
                        <span class="material-symbols-outlined lock-icon">lock_reset</span>
                    </div>
                </div>

                <div class="text-section">
                    <h1>Forgot password?</h1>
                    <p>No worries! Enter your email or username below and we'll send you instructions to reset your
                        password.</p>
                </div>

                <div *ngIf="message" [class.error-message]="isError" [class.success-message]="isSuccess"
                    style="margin: 0 2rem;">
                    {{ message }}
                </div>

                <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="fp-form">
                    <label class="form-group">
                        <span class="label-text">Email or Username</span>
                        <div class="input-wrapper group">
                            <span class="material-symbols-outlined input-icon">person</span>
                            <input type="text" formControlName="identifier" placeholder="Enter your email or username">
                        </div>
                        <div *ngIf="forgotPasswordForm.get('identifier')?.touched && forgotPasswordForm.get('identifier')?.invalid"
                            class="validation-error">
                            Email or Username is required
                        </div>
                    </label>

                    <button type="submit" class="recover-btn" [disabled]="forgotPasswordForm.invalid">
                        <span>Recover Password</span>
                    </button>

                    <div class="security-badge">
                        <span class="material-symbols-outlined badge-icon">gpp_good</span>
                        <span>Your information is securely encrypted</span>
                    </div>
                </form>
            </div>

            <div class="back-link-container">
                <a routerLink="/login" class="back-link group">
                    <span class="material-symbols-outlined back-arrow">arrow_back</span>
                    <span>Back to log in</span>
                </a>
            </div>
        </div>
    </main>

    <div class="bg-decor">
        <div class="decor-blob-1"></div>
        <div class="decor-blob-2"></div>
    </div>
</div>
